name: AI Tutor guided preview checks

on:
  pull_request:
    paths:
      - 'features/ai-tutor/**'
      - 'app/ai-tutor-preview/**'
      - 'app/api/ai-tutor-preview/**'
      - '.github/workflows/ai-tutor-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-tutor-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teaching-engine-checks:
    name: Adaptive lesson tests and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic adaptive tutor checks
        run: npx vitest run features/ai-tutor
      - name: Run TypeScript validation
        run: npx tsc --noEmit
