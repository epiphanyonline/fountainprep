name: Exam Success isolated checks

on:
  pull_request:
    branches: [main]
    paths:
      - "features/exam-success/**"
      - "docs/exam-success/**"
      - ".github/workflows/exam-success-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-success-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-checks:
    name: Exam engine tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR code (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated mock engine tests
        run: npx vitest run features/exam-success
      - name: TypeScript check
        run: npx tsc --noEmit
